name: YeNo submission contract
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify standalone API, state guards, and depth execution
        run: python -m unittest discover -s tests -v
      - name: Compile standalone Python
        run: python -m compileall -q bot.py yeno_evaluator tests
